# mcl-graph: how to run this service.
#
# Runnable as-is. It carries what the SERVICE knows about itself: its image, its
# port, the environment its code reads, its volumes and its health check.
#
#   MCL_REALM=<64-hex> MCL_REALM_NAME=io.macula \
#     MCL_REALM_KEY=<hex of the realm's public signing key> \
#     MACULA_STATION_SEEDS=station.example:4433 \
#     MACULA_STATION_NODE_IDS=<64-hex node id of that station> \
#     MCL_BOX=<this host's name> \
#     docker compose -p mcl-graph -f deploy/docker-compose.yml up -d
#
# Placement (which host, which station, which pinned version) belongs to the
# fleet repository, not here.

services:
  mcl-graph:
    image: ghcr.io/macula-services/mcl-graph:latest
    container_name: mcl-graph
    restart: unless-stopped
    # macula stations are reachable over IPv6 only, and a default bridge has no
    # IPv6: a bridged container connects to nothing and looks fine.
    network_mode: host
    volumes:
      # ⚠ THE GRAPH ITSELF. Without the mount every recreate forgets it. On a
      # bulk drive on a fleet node, not the small eMMC root.
      - ${MCL_GRAPH_DATA:-/bulk0/mcl-graph}:/data
      # ⚠ NAMED, SO IT OUTLIVES THE CONTAINER: the node identity every fact and
      # advertisement is signed with.
      - secrets:/etc/mcl/secrets
    environment:
      # No defaults: a service that guesses its realm announces itself where
      # nobody can attribute it.
      - MCL_REALM=${MCL_REALM:?set MCL_REALM to the 64-hex realm tag}
      - MCL_REALM_NAME=${MCL_REALM_NAME:?set MCL_REALM_NAME to the realm name, e.g. io.macula}
      - MCL_REALM_KEY=${MCL_REALM_KEY:?set MCL_REALM_KEY to the hex-encoded public realm signing key}
      # The 12.x dial is PINNED: each seed pairs with its station's node id,
      # index for index.
      - MACULA_STATION_SEEDS=${MACULA_STATION_SEEDS:?set MACULA_STATION_SEEDS to "host[:port][,host[:port]...]"}
      - MACULA_STATION_NODE_IDS=${MACULA_STATION_NODE_IDS:?set MACULA_STATION_NODE_IDS to the matching 64-hex node ids}
      - MCL_NODE_NAME=mcl_graph
      - MCL_NODE_HOST=127.0.0.1
      - MCL_COOKIE=mcl_graph
      # Host networking: a port already bound on the host fails SILENTLY.
      - MCL_HEALTH_PORT=8482
      # Labels on the claim this service sends the realm at boot, shown to the
      # realm's operator on the pending row: what is asking, and from which
      # box. The realm admits no claim that does not show both.
      - MCL_SERVICE_NAME=mcl-graph
      - MCL_BOX=${MCL_BOX:?set MCL_BOX to the name of the host this runs on}
      - MCL_DATA_DIR=/data

# Named here, not left to the project name, so `-p' with another name reuses the
# same identity instead of quietly starting a second one.
volumes:
  secrets:
    name: mcl-graph-secrets
