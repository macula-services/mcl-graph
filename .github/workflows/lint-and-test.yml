# Lint, EUnit and Dialyzer, in the CI image that pins the toolchain.
#
# The suite includes mcl_graph_store_tests, which opens a real CozoDB through
# the NIF, so the NIF is built here exactly as the image builds it: the
# rebar3 compile hook runs native/build-nif.sh, and a failed NIF build fails
# the compile.

name: lint-and-test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'scripts/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      # ⚠ MUST MATCH THE `Containerfile' beside it: OTP 28.4.3. The dated
      # macula-ci-otp tag is macula-io/macula-ci-images' build (OTP 28.4.3, an
      # OpenSSL with ML-DSA, rebar3, Rust 1.98.1, cmake), pinned by digest; the
      # step below refuses anything else. mcl_graph_service_tests guards the pins.
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      # libsnappy-dev liblz4-dev libzstd-dev libbz2-dev: rocksdb (via mcl_om's
      # barrel_docdb) silently disables a codec whose dev lib is missing, and
      # the NIF it builds then cannot open its store.
      # libclang-dev: bindgen, for the CozoDB NIF's cozorocks.
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libsnappy-dev liblz4-dev libzstd-dev libbz2-dev libclang-dev
      # The NIF's cold build (cozo, cozorocks, RocksDB) is most of this job's
      # time; its registry and target directory are cached on the lock file and
      # the toolchain, which the image pins.
      - name: Cache the NIF build
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            native/mcl_graph_nif/target
          key: nif-${{ hashFiles('native/mcl_graph_nif/Cargo.lock') }}-rust-1.98.1
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
