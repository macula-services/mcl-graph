# Lint, EUnit and Dialyzer, in the CI image the Containerfile's builder uses.
#
# The suite includes mcl_graph_store_tests, which opens a real CozoDB through
# the NIF, so the NIF is built here exactly as the image builds it: the
# rebar3 compile hook runs native/build-nif.sh (baseline x86-64), and a failed
# NIF build fails the compile.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      # ⚠ THE SAME BUILD IMAGE AS THE Containerfile, BY DATED TAG AND DIGEST:
      # OTP 28.4.3 with ML-DSA, rebar3, Rust, cmake and a C++ toolchain. The
      # step below refuses any other release; mcl_graph_service_tests guards
      # the pins.
      image: ghcr.io/macula-io/macula-ci-otp-rocksdb:20260928-1642@sha256:57e3929c45976fbc1d216bddfde831cad7b7e276d8197b099dfbac0cd731a8c9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          rustc --version
          cargo --version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      # The NIF's cold build (cozo, cozorocks, RocksDB) is most of this job's
      # time; its registry and target directory are cached on the lock file and
      # the image, which pins the toolchain.
      - name: Cache the NIF build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/cargo/registry
            native/mcl_graph_nif/target
          key: nif-${{ hashFiles('native/mcl_graph_nif/Cargo.lock') }}-ci-otp-rocksdb-20260928-1642
      - run: rebar3 lint
      - run: rebar3 eunit
      # Keep it gating: it is the M3 bar, and it reads the macula and mcl_om
      # calls the tests stub.
      - run: rebar3 dialyzer
