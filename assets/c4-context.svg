<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="mcl-graph system context">
<title>mcl-graph system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-small { font-size: 12px; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #66736E; stroke-width: 1.25; stroke-dasharray: 7 5; }
.bound-in { fill: none; stroke: #D9DFDC; stroke-width: 1.5; stroke-dasharray: 4 4; }
.head { fill: #3B5B7A; }
.t-name { fill: #16201D; }
.t-code { fill: #16201D; }
.t-type { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-bound { fill: #66736E; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; stroke-width: 2; }
.b-ext { fill: #1C2421; stroke: #7D8B85; stroke-width: 1.25; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; stroke-width: 1.25; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; stroke-width: 1.25; }
.b-later { fill: none; stroke: #7D8B85; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #93A09A; stroke-width: 1.25; stroke-dasharray: 7 5; }
.bound-in { fill: none; stroke: #2A3431; stroke-width: 1.5; stroke-dasharray: 4 4; }
.head { fill: #8EB4D8; }
.t-name { fill: #E6ECE9; }
.t-code { fill: #E6ECE9; }
.t-type { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-bound { fill: #93A09A; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="600"/>

<path class="edge" d="M135 130V200" marker-end="url(#a)"/>
<path class="edge" d="M250 262H370" marker-end="url(#a)"/>
<path class="edge" d="M750 262H630" marker-end="url(#a)"/>
<path class="edge" d="M500 130V200" marker-end="url(#a)"/>
<path class="edge" d="M630 215H690V80H750" marker-end="url(#a)"/>
<path class="edge" d="M420 340V440" marker-end="url(#a)"/>
<path class="edge" d="M580 340V440" marker-end="url(#a)"/>
<rect class="b-per" x="20" y="30" width="230" height="100" rx="10"/>
<circle class="head" cx="46" cy="54" r="9"/>
<text class="t-name" x="64" y="58">Agent</text>
<text class="t-type" x="64" y="76">[Person or AI agent]</text>
<text class="t-desc" x="36" y="100">Asks and teaches the graph</text>
<text class="t-desc" x="36" y="116">through MCP tools</text>
<rect class="b-ext" x="390" y="30" width="220" height="100" rx="10"/>
<text class="t-name" x="406" y="58">Truth producers</text>
<text class="t-type" x="406" y="76">[External: realm members]</text>
<text class="t-desc" x="406" y="100">Publish truth_asserted_v1</text>
<text class="t-desc" x="406" y="116">for the graph to learn</text>
<rect class="b-ext" x="750" y="30" width="230" height="110" rx="10"/>
<text class="t-name" x="766" y="58">Graph consumers</text>
<text class="t-type" x="766" y="76">[External system]</text>
<text class="t-desc" x="766" y="100">Compose one graph from many</text>
<text class="t-desc" x="766" y="116">instances: resolve_link on</text>
<text class="t-desc" x="766" y="132">each, or the facts</text>
<rect class="b-ext" x="20" y="200" width="230" height="130" rx="10"/>
<text class="t-name" x="36" y="228">macula-mcp</text>
<text class="t-type" x="36" y="246">[External: MCP server]</text>
<text class="t-desc" x="36" y="270">Outside the fleet. mesh_call;</text>
<text class="t-desc" x="36" y="286">prove_ownership: 1 adds an</text>
<text class="t-desc" x="36" y="302">asserted_by proof v2</text>
<rect class="b-sys" x="370" y="200" width="260" height="140" rx="10"/>
<text class="t-name" x="386" y="228">mcl-graph</text>
<text class="t-type" x="386" y="246">[Software system, mcl-om service]</text>
<text class="t-desc" x="386" y="270">One instance's graph (CozoDB):</text>
<text class="t-desc" x="386" y="286">resolves, learns with</text>
<text class="t-desc" x="386" y="302">provenance, narrates, and</text>
<text class="t-desc" x="386" y="318">publishes what it learns</text>
<rect class="b-ext" x="750" y="200" width="230" height="130" rx="10"/>
<text class="t-name" x="766" y="228">Any realm member</text>
<text class="t-type" x="766" y="246">[External: mesh callers]</text>
<text class="t-desc" x="766" y="270">Every procedure is open;</text>
<text class="t-desc" x="766" y="286">the verified caller is</text>
<text class="t-desc" x="766" y="302">recorded as provenance</text>
<rect class="b-ext" x="230" y="440" width="250" height="110" rx="10"/>
<text class="t-name" x="246" y="468">macula-station</text>
<text class="t-type" x="246" y="486">[External system]</text>
<text class="t-desc" x="246" y="510">Pinned home station(s);</text>
<text class="t-desc" x="246" y="526">carries every call and fact</text>
<text class="t-desc" x="246" y="542">to and from this node</text>
<rect class="b-ext" x="520" y="440" width="250" height="110" rx="10"/>
<text class="t-name" x="536" y="468">macula-realm</text>
<text class="t-type" x="536" y="486">[External system]</text>
<text class="t-desc" x="536" y="510">Boot identity claim; a D25</text>
<text class="t-desc" x="536" y="526">provider grant per procedure;</text>
<text class="t-desc" x="536" y="542">the realm key is the anchor</text>
<text class="t-rel" x="143" y="170">uses</text>
<text class="t-rel" x="310" y="238" text-anchor="middle">learn_link,</text>
<text class="t-rel" x="310" y="252" text-anchor="middle">resolve_*, narrate_*</text>
<text class="t-rel" x="310" y="282" text-anchor="middle">(over the mesh,</text>
<text class="t-rel" x="310" y="296" text-anchor="middle">optional asserted_by)</text>
<text class="t-rel" x="690" y="252" text-anchor="middle">resolve, learn,</text>
<text class="t-rel" x="690" y="282" text-anchor="middle">narrate, info</text>
<text class="t-rel" x="492" y="160" text-anchor="end">publish</text>
<text class="t-rel" x="492" y="174" text-anchor="end">truth_asserted_v1</text>
<text class="t-rel" x="684" y="150" text-anchor="end">publishes</text>
<text class="t-rel" x="684" y="164" text-anchor="end">entity_learned_v1,</text>
<text class="t-rel" x="684" y="178" text-anchor="end">link_learned_v1</text>
<text class="t-rel" x="412" y="386" text-anchor="end">dials out,</text>
<text class="t-rel" x="412" y="400" text-anchor="end">pinned (QUIC, pq_hybrid)</text>
<text class="t-rel" x="588" y="386">claims its identity,</text>
<text class="t-rel" x="588" y="400">gets provider grants</text>
<text class="t-rel" x="20" y="585">Every call and fact travels over the mesh, through the station.</text>
</svg>
